
spring.application.name=vuelo-operaciones-ms

server.port=8091

# Kafka ejecutandose en Docker Desktop
spring.kafka.bootstrap-servers=localhost:49092

# Configuracion del productor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Topic del Proyecto Sello
app.kafka.topic.operaciones=vuelos-operaciones

# Actuator
management.endpoints.web.exposure.include=health,info
