
name: aire-bigdata-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aire-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:49090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - lambda26-kafka-net

  grafana:
    image: grafana/grafana:12.1.0
    container_name: aire-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:43000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Configurar contraseña}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - lambda26-kafka-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  lambda26-kafka-net:
    external: true
    name: lambda26-kafka-net
